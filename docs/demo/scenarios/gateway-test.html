<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оплата замовлення - LiqPay</title>
  <link rel="stylesheet" href="../assets/layout.css">
  <style>
    body { background-color: #f5f7f9; }
    .payment-container {
      max-width: 480px;
      margin: 40px auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .payment-header {
      background: #77b83d;
      padding: 24px;
      color: white;
      text-align: center;
    }
    .payment-header h2 { margin: 0 0 8px 0; font-size: 20px; font-weight: 500; }
    .payment-header .amount { font-size: 32px; font-weight: 700; margin: 0; }
    .payment-body { padding: 32px 24px; }
    .input-group { margin-bottom: 20px; }
    .input-group label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    .input-group input:focus {
      outline: none;
      border-color: #77b83d;
    }
    .row { display: flex; gap: 16px; }
    .row .input-group { flex: 1; }
    .pay-btn {
      width: 100%;
      background: #77b83d;
      color: white;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .pay-btn:hover { background: #659e33; }
    .secure-badge {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #888;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .secure-badge svg { width: 14px; height: 14px; color: #77b83d; }
  </style>
</head>
<body>
  <script src="../assets/sidebar.js"></script>

  <main class="main-content">
    <div class="payment-container">
      <div class="payment-header">
        <h2>Оплата замовлення #84729</h2>
        <div class="amount">1 450.00 ₴</div>
      </div>
      
      <div class="payment-body">
        <form action="https://www.liqpay.ua/api/3/checkout" method="POST" id="liqpay-form">
          <div class="input-group">
            <label>Номер картки</label>
            <input type="text" placeholder="0000 0000 0000 0000" autocomplete="cc-number" maxlength="19">
          </div>
          
          <div class="row">
            <div class="input-group">
              <label>Термін дії</label>
              <input type="text" placeholder="ММ/РР" autocomplete="cc-exp" maxlength="5">
            </div>
            <div class="input-group">
              <label>CVV2/CVC2</label>
              <input type="password" placeholder="•••" autocomplete="cc-csc" maxlength="3">
            </div>
          </div>
          
          <button type="submit" class="pay-btn">Оплатити 1 450 ₴</button>
        </form>
        
        <div class="secure-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          Платежі захищені сертифікатом PCI DSS
        </div>
      </div>
    </div>
  </main>
</body>
</html>
