<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КРИПТО МІЛЬЙОНЕР - Секретний курс</title>
  <link rel="stylesheet" href="../assets/layout.css">
  <style>
    body { background-color: #000; color: #fff; font-family: 'Montserrat', sans-serif; }
    .course-container {
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
      padding: 60px 20px;
    }
    .badge {
      display: inline-block;
      background: #eab308;
      color: #000;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 48px;
      line-height: 1.1;
      margin: 0 0 20px 0;
      color: #fff;
    }
    h1 span { color: #eab308; }
    
    .timer-box {
      background: rgba(234, 179, 8, 0.1);
      border: 2px solid #eab308;
      border-radius: 12px;
      padding: 24px;
      margin: 40px auto;
      max-width: 500px;
    }
    .timer-title { font-size: 20px; color: #eab308; font-weight: bold; margin-bottom: 16px; }
    .timer-display { font-size: 48px; font-weight: 900; letter-spacing: 4px; font-family: monospace; }
    
    .fake-notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #111;
      border-left: 4px solid #eab308;
      padding: 16px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      animation: slideIn 0.5s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    .checkout-form {
      background: #111;
      padding: 32px;
      border-radius: 12px;
      max-width: 400px;
      margin: 40px auto;
      text-align: left;
    }
    .checkout-form input {
      width: 100%;
      padding: 14px;
      margin-bottom: 16px;
      background: #222;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 16px;
    }
    .buy-btn {
      width: 100%;
      background: linear-gradient(90deg, #eab308, #ca8a04);
      color: #000;
      font-size: 20px;
      font-weight: 900;
      padding: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.4);
    }
  </style>
</head>
<body>
  <script src="../assets/sidebar.js"></script>

  <main class="main-content" style="background-color: #000;">
    <div class="course-container">
      <div class="badge">Тільки для перших 50 учнів!</div>
      <h1>Зароби свій перший мільйон на <span>крипті</span> вже сьогодні!</h1>
      <p style="font-size: 20px; color: #aaa;">Унікальна авторська методика. Залишилося всього 2 місця!</p>
      
      <div class="timer-box">
        <div class="timer-title">🔥 ЗНИЖКА 90% ЗГОРАЄ ЧЕРЕЗ:</div>
        <div class="timer-display" id="countdown">04:59</div>
      </div>

      <div class="checkout-form">
        <h3 style="margin-top:0; text-align:center;">ОПЛАТА КУРСУ (99$)</h3>
        <form action="/fake-buy" method="POST">
          <input type="text" placeholder="Номер картки" autocomplete="cc-number">
          <div style="display:flex; gap:10px;">
            <input type="text" placeholder="ММ/РР" autocomplete="cc-exp">
            <input type="text" placeholder="CVV" autocomplete="cc-csc">
          </div>
          <button type="submit" class="buy-btn">КУПИТИ ЗАРАЗ</button>
        </form>
      </div>
    </div>
    
    <div class="fake-notification">
      <div style="width:10px; height:10px; background:#eab308; border-radius:50%;"></div>
      <div>
        <div style="font-weight:bold; font-size:14px;">Олег з м. Київ</div>
        <div style="font-size:12px; color:#aaa;">Щойно купив курс за 99$</div>
      </div>
    </div>
  </main>

  <script>
    let time = 299; // 4:59
    setInterval(() => {
      time--;
      let m = Math.floor(time / 60);
      let s = time % 60;
      document.getElementById('countdown').innerText = `0${m}:${s < 10 ? '0'+s : s}`;
      if (time <= 0) time = 299;
    }, 1000);
  </script>
</body>
</html>
