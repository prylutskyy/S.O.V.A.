name: Evaluation

on:
  push:
    branches-ignore: [metrics-history]
    paths-ignore:
      - 'site/**'
      - 'metrics/**'
  pull_request:
    paths-ignore:
      - 'site/**'
      - 'metrics/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    outputs:
      report-ready: ${{ steps.run-tests.outputs.report-ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate WXT TypeScript configuration
        run: npx wxt prepare
      - name: Type check
        run: npm run compile
      - name: Run non-integration tests and export corpus metrics
        id: run-tests
        env:
          SOVA_EVAL_REPORT: metrics/evaluation.json
          SOVA_REVIEW_REPORT: metrics/review-evaluation.json
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          mkdir -p metrics
          set +e
          npm test -- --exclude 'tests/integration/**' --reporter=dot
          test_status=$?
          if [[ -f metrics/evaluation.json && -f metrics/review-evaluation.json ]] && node scripts/review/merge-evaluation.mjs; then
            echo 'report-ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'report-ready=false' >> "$GITHUB_OUTPUT"
            test_status=1
          fi
          exit "$test_status"
      - name: Explain regression, challenge and AI-reviewed stress results
        if: always() && steps.run-tests.outputs.report-ready == 'true'
        run: node scripts/evaluation/write-ci-summary.mjs metrics/evaluation.json
      - name: Upload evaluation report
        if: always() && steps.run-tests.outputs.report-ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ github.sha }}
          path: metrics/evaluation.json
          if-no-files-found: error
          retention-days: 90

  publish-dashboard:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && always() && needs.evaluate.outputs.report-ready == 'true'
    needs: evaluate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: evaluation-${{ github.sha }}
          path: metrics
      - name: Append metric summary to history branch
        uses: actions/github-script@v7
        env:
          REPORT_PATH: metrics/evaluation.json
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
            const branch = 'metrics-history';
            let branchExists = true;
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              branchExists = false;
              await github.rest.git.createRef({
                ...context.repo,
                ref: `refs/heads/${branch}`,
                sha: context.sha,
              });
            }

            let history = [];
            let existingSha;
            if (branchExists) {
              try {
                const response = await github.rest.repos.getContent({
                  ...context.repo,
                  path: 'history.json',
                  ref: branch,
                });
                existingSha = response.data.sha;
                history = JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const summary = {
              schemaVersion: report.schemaVersion,
              groups: report.groups,
              combined: report.combined,
              evaluatedCases: report.evaluatedCases,
              generatedAt: report.generatedAt,
              commit: report.commit,
              corpusSha256: report.corpusSha256,
              totalCases: report.totalCases,
              exactMatches: report.exactMatches,
              exactMatchRate: report.exactMatchRate,
              overall: report.overall,
              byCorpus: report.byCorpus,
              byIntentType: report.byIntentType,
              actionMismatches: report.actionMismatches,
              falseLockInputs: report.falseLockInputs,
            };
            history = history.filter((item) => item.commit !== summary.commit);
            history.push(summary);
            history.sort((a, b) => new Date(a.generatedAt) - new Date(b.generatedAt));
            history = history.slice(-500);
            const content = `${JSON.stringify(history, null, 2)}\n`;
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path: 'history.json',
              branch,
              message: `chore(metrics): record evaluation ${String(summary.commit).slice(0, 7)}`,
              content: Buffer.from(content).toString('base64'),
              ...(existingSha ? { sha: existingSha } : {}),
            });
            fs.mkdirSync('metrics', { recursive: true });
            fs.writeFileSync('metrics/history.json', content);
      - name: Generate dashboard and badges
        run: npm run test:dashboard -- --report metrics/evaluation.json --history metrics/history.json --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
